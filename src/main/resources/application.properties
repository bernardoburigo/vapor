spring.application.name=trabalho1
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5434/trabalho1
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT (Etapa 3) ---
# Em produção, defina JWT_SECRET (>= 32 bytes) por variável de ambiente; o valor padrão serve apenas para desenvolvimento.
app.jwt.secret=${JWT_SECRET:vapor-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Usuário ADMIN criado na inicialização, se ainda não existir (apenas desenvolvimento) ---
app.admin.nome=${APP_ADMIN_NOME:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:admin@vapor.com}
app.admin.senha=${APP_ADMIN_SENHA:admin123}

# --- CORS: origens permitidas para o frontend, separadas por vírgula ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
